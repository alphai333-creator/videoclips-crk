<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Video Gallery</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #000;
      color: white;
    }

    header {
      background-color: black;
      text-align: center;
      padding: 20px 0;
      font-size: 28px;
      font-weight: bold;
      border-bottom: 2px solid white;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      padding: 40px;
    }

    .block {
      background-color: black;
      border: 2px solid white;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.3s ease, background-color 0.3s ease;
    }

    .block:hover {
      transform: scale(1.03);
      background-color: #111;
    }

    .block img {
      width: 100%;
      border-radius: 10px;
    }

    .block h2 {
      margin-top: 10px;
      font-size: 18px;
    }

    footer {
      background-color: black;
      text-align: center;
      padding: 20px;
      border-top: 2px solid white;
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.9);
    }

    .modal-content {
      position: relative;
      margin: auto;
      padding: 20px;
      width: 90%;          /* Large width */
      max-width: 1200px;   /* Maximum width */
      height: 70vh;        /* 70% of viewport height */
    }

    .modal-content iframe {
      width: 100%;
      height: 100%;
      border-radius: 10px;
      border: none;
    }

    .close {
      position: absolute;
      top: 10px;
      right: 25px;
      color: white;
      font-size: 35px;
      font-weight: bold;
      cursor: pointer;
    }

    .close:hover,
    .close:focus {
      color: #bbb;
      text-decoration: none;
    }

  </style>
</head>
<body>
  <header>🎬 My Video Gallery</header>

  <div class="container">
    <div class="block" data-video="https://www.youtube.com/embed/Gil3OZVcApo">
      <img src="https://img.youtube.com/vi/Gil3OZVcApo/hqdefault.jpg" alt="Video 1">
      <h2>Video 1</h2>
    </div>

    <div class="block" data-video="https://www.youtube.com/embed/O8-fPB3gWro">
      <img src="https://img.youtube.com/vi/O8-fPB3gWro/hqdefault.jpg" alt="Video 2">
      <h2>Video 2</h2>
    </div>

    <div class="block" data-video="https://www.youtube.com/embed/8cERW9N4bIg">
      <img src="https://img.youtube.com/vi/8cERW9N4bIg/hqdefault.jpg" alt="Video 3">
      <h2>Video 3</h2>
    </div>

    <div class="block" data-video="https://www.youtube.com/embed/GIxzhgwKZyE">
      <img src="https://img.youtube.com/vi/GIxzhgwKZyE/hqdefault.jpg" alt="Video 4">
      <h2>Video 4</h2>
    </div>

    <div class="block" data-video="https://www.youtube.com/embed/IUCeIFbIKwE">
      <img src="https://img.youtube.com/vi/IUCeIFbIKwE/hqdefault.jpg" alt="Video 5">
      <h2>Video 5</h2>
    </div>

    <div class="block" data-video="https://www.youtube.com/embed/XQ9_FY2BeWs">
      <img src="https://img.youtube.com/vi/XQ9_FY2BeWs/hqdefault.jpg" alt="Video 6">
      <h2>Video 6</h2>
    </div>

    <div class="block" data-video="https://www.youtube.com/embed/gb2G9Yt_J1M">
      <img src="https://img.youtube.com/vi/gb2G9Yt_J1M/hqdefault.jpg" alt="Video 7">
      <h2>Video 7</h2>
    </div>

    <div class="block" data-video="https://www.youtube.com/embed/cVVMW7GIvl8">
      <img src="https://img.youtube.com/vi/cVVMW7GIvl8/hqdefault.jpg" alt="Video 8">
      <h2>Video 8</h2>
    </div>

    <div class="block" data-video="https://www.youtube.com/embed/eCA-ETSkU80">
      <img src="https://img.youtube.com/vi/eCA-ETSkU80/hqdefault.jpg" alt="Video 9">
      <h2>Video 9</h2>
    </div>
  </div>

  <footer>© 2025 My Video Website</footer>

  <!-- Modal -->
  <div id="videoModal" class="modal">
    <span class="close">&times;</span>
    <div class="modal-content">
      <iframe id="modalVideo" src="" frameborder="0" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    const blocks = document.querySelectorAll('.block');
    const modal = document.getElementById('videoModal');
    const modalVideo = document.getElementById('modalVideo');
    const closeBtn = document.querySelector('.close');

    blocks.forEach(block => {
      block.addEventListener('click', () => {
        const videoSrc = block.getAttribute('data-video');
        modal.style.display = 'block';
        modalVideo.src = videoSrc;
      });
    });

    closeBtn.addEventListener('click', () => {
      modal.style.display = 'none';
      modalVideo.src = '';
    });

    window.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.style.display = 'none';
        modalVideo.src = '';
      }
    });
  </script>
</body>
</html>
